<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pierwszy Program</title>
<style>
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #14708c, #2e4664); color: #fff;
  }
  .karta { text-align: center; padding: 40px; }
  h1 { font-size: 42px; margin: 0 0 8px; }
  p { opacity: .85; margin: 0 0 24px; }
  input { padding: 10px 14px; font-size: 16px; border-radius: 8px; border: none; width: 220px; }
  button { padding: 10px 18px; font-size: 16px; border-radius: 8px; border: none; margin-left: 8px;
    background: #fff; color: #14708c; font-weight: 600; cursor: pointer; }
  #wynik { margin-top: 24px; font-size: 22px; min-height: 30px; }
  .stopka { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: .6; }
</style>
</head>
<body>
  <div class="karta">
    <h1>Działa! 🎉</h1>
    <p>To jest pierwszy skompilowany program.</p>
    <input id="imie" placeholder="Wpisz swoje imię">
    <button onclick="przywitaj()">Przywitaj</button>
    <div id="wynik"></div>
  </div>
  <div class="stopka">Słowa mają moc · Michał Chmay</div>
<script>
  function przywitaj() {
    const imie = document.getElementById('imie').value.trim() || 'nieznajomy';
    document.getElementById('wynik').textContent = 'Cześć, ' + imie + '!';
  }
  document.getElementById('imie').addEventListener('keydown', e => { if (e.key === 'Enter') przywitaj(); });
</script>
</body>
</html>
