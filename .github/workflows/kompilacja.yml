name: Kompilacja

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: Mac
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            name: Windows
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Pobranie plikow projektu
        uses: actions/checkout@v4

      - name: Instalacja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Pamiec podreczna (przyspiesza kolejne kompilacje)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalacja narzedzi Tauri
        run: npm install

      - name: Generowanie ikon
        run: npx tauri icon app-icon.svg

      - name: Kompilacja programu
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Udostepnienie gotowego programu
        uses: actions/upload-artifact@v4
        with:
          name: Program-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
